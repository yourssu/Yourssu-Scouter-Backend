name: check-migrations

# 두 PR이 같은 버전 번호를 쓰면 파일 이름이 달라 git이 충돌을 내지 않는다.
# 그래서 배포의 flywayMigrate 전까지 아무도 모른다.
#
# paths 필터를 일부러 두지 않았다. required status check로 지정했을 때
# paths로 건너뛴 체크는 영원히 pending으로 남아 머지를 막는다.

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: check-migrations-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-migration-versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Flyway migration versions
        run: |
          chmod +x scripts/check-migration-versions.sh
          ./scripts/check-migration-versions.sh "${{ github.base_ref }}"
