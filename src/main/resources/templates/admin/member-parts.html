<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SCOUTER ADMIN - 멤버 파트 배정</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        * {
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            letter-spacing: -0.01em;
        }

        body {
            background-color: #f7f9fb;
            color: #1e293b;
        }

        .scouter-wrapper {
            max-width: 1080px;
            padding: 40px 48px;
        }

        .page-header {
            margin-bottom: 28px;
        }
        .page-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .member-card {
            background: #ffffff;
            border: 1px solid #eef2f6;
            border-radius: 18px;
            padding: 26px 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .num-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            padding: 0 8px;
            border-radius: 8px;
            background-color: #f1f3fe;
            color: #6366f1;
            font-weight: 700;
            font-size: 0.85rem;
        }

        .part-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 5px 8px 5px 12px;
            border-radius: 8px;
            margin: 0 6px 6px 0;
        }
        .part-chip button {
            border: none;
            background: transparent;
            color: #94a3b8;
            line-height: 1;
            padding: 0 2px;
            font-size: 0.95rem;
        }
        .part-chip button:hover {
            color: #be123c;
        }

        .no-part-chip {
            display: inline-block;
            background-color: #fff7ed;
            color: #c2410c;
            border: 1px solid #fed7aa;
            font-weight: 600;
            font-size: 0.8rem;
            padding: 5px 10px;
            border-radius: 8px;
        }

        .field-group-card {
            background-color: #fafbfc;
            border: 1px solid #f1f4f8;
            border-radius: 12px;
            padding: 16px 18px;
        }

        .form-control-custom {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.88rem;
            color: #334155;
        }
        .form-control-custom:focus {
            background-color: #ffffff;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            outline: none;
        }

        .btn-save {
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 500;
            font-size: 0.82rem;
            border-radius: 8px;
            padding: 8px 14px;
            border: none;
        }
        .btn-save:hover {
            background-color: #334155;
            color: #ffffff;
        }

        .member-row {
            border-bottom: 1px solid #f1f4f8;
            padding: 16px 0;
        }
        .member-row:last-child {
            border-bottom: none;
        }

        .save-toast {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 9999;
        }
        .custom-toast {
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 0.9rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
</head>
<body class="d-flex min-vh-100">

<div th:replace="~{admin/fragments/nav :: sidebar}" th:with="currentMenu='member-parts'"></div>

<div class="flex-grow-1 scouter-wrapper">

    <div class="page-header">
        <div class="d-flex align-items-center gap-2 mb-1">
            <span class="num-badge">Member</span>
            <h2 class="page-title mb-0">멤버 파트 배정</h2>
        </div>
        <p class="text-muted small mb-0 ps-1">
            멤버에게 파트를 하나씩 배정하고 해제합니다. 이 배정이 지원자 평가자 목록을 결정합니다.
            마지막 파트는 해제할 수 없습니다. 파트를 옮기려면 새 파트를 먼저 배정하세요.
        </p>
    </div>

    <div class="member-card">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label small fw-semibold text-muted">이름 또는 닉네임</label>
                <input id="filter-search" type="text" class="form-control form-control-custom" th:value="${search}" placeholder="검색어">
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold text-muted">멤버 상태</label>
                <select id="filter-state" class="form-select form-control-custom">
                    <option th:each="s : ${states}" th:value="${s}" th:text="${s}"
                            th:selected="${s == state}">ACTIVE</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small fw-semibold text-muted">파트</label>
                <select id="filter-part" class="form-select form-control-custom">
                    <option value="">전체</option>
                    <option th:each="part : ${parts}" th:value="${part.id}"
                            th:text="${part.division.name} + ' / ' + ${part.name}"
                            th:selected="${partId != null and part.id == partId}">Backend</option>
                </select>
            </div>
            <div class="col-md-2">
                <button type="button" class="btn-save w-100" onclick="applyFilter()">검색</button>
            </div>
        </div>
    </div>

    <div th:if="${error != null}" class="alert alert-warning" th:text="${error}">오류</div>

    <div class="member-card">
        <h6 class="fw-bold mb-3">멤버
            <span class="text-muted fw-normal" th:text="'(' + ${members != null ? #lists.size(members) : 0} + ')'">(0)</span>
        </h6>

        <div th:if="${members == null or #lists.isEmpty(members)}" class="text-muted small" id="no-members">
            조건에 맞는 멤버가 없습니다.
        </div>

        <div th:each="m : ${members}" class="member-row" th:attr="data-member-id=${m.memberId}">
            <div class="row g-3 align-items-center">
                <div class="col-md-4">
                    <div class="fw-semibold" th:text="${m.name}">이름</div>
                    <div class="text-muted" style="font-size: 0.78rem;">
                        <span th:text="${m.nickname}">nick(닉)</span>
                        <span th:text="' · ' + ${m.email}"> · a@b.c</span>
                    </div>
                    <div class="text-muted" style="font-size: 0.78rem;">
                        <span th:text="'멤버 ID ' + ${m.memberId}">멤버 ID 1</span>
                        <span th:text="' · ' + ${m.role}"> · MEMBER</span>
                        <span th:text="' · ' + ${m.state}"> · ACTIVE</span>
                    </div>
                </div>

                <div class="col-md-5">
                    <div th:if="${#lists.isEmpty(m.parts)}" class="no-part-chip">
                        배정된 파트 없음
                    </div>
                    <span th:each="p : ${m.parts}" class="part-chip" th:attr="data-part-id=${p.id}">
                        <span th:text="${p.name}">Backend</span>
                        <button type="button" title="해제"
                                th:attr="onclick='unassignPart(' + ${m.memberId} + ',' + ${p.id} + ')'">&times;</button>
                    </span>
                </div>

                <div class="col-md-3">
                    <div class="d-flex gap-2">
                        <select th:id="'assign-part-' + ${m.memberId}" class="form-select form-control-custom">
                            <option value="">파트 선택</option>
                            <option th:each="part : ${parts}" th:value="${part.id}"
                                    th:text="${part.name}">Backend</option>
                        </select>
                        <button type="button" class="btn-save text-nowrap"
                                th:attr="onclick='assignPart(' + ${m.memberId} + ')'">배정</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="save-toast">
    <div id="toast" class="toast custom-toast align-items-center border-0 text-bg-dark" role="alert">
        <div class="d-flex align-items-center">
            <div class="toast-body p-0 pe-2" id="toast-message"></div>
            <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    function applyFilter() {
        const params = new URLSearchParams();
        const search = document.getElementById('filter-search').value.trim();
        const state = document.getElementById('filter-state').value;
        const partId = document.getElementById('filter-part').value;
        if (search) params.append('search', search);
        if (state) params.append('state', state);
        if (partId) params.append('partId', partId);
        location.href = '/admin/recruiting/member-parts?' + params.toString();
    }

    async function assignPart(memberId) {
        const partId = document.getElementById('assign-part-' + memberId).value;
        if (!partId) {
            showToast('✕ 배정할 파트를 고르세요.', true);
            return;
        }
        await submit('/admin/recruiting/member-parts/assign', memberId, partId, '배정');
    }

    async function unassignPart(memberId, partId) {
        if (!confirm('이 파트 배정을 해제합니다. 계속할까요?')) {
            return;
        }
        await submit('/admin/recruiting/member-parts/unassign', memberId, partId, '해제');
    }

    async function submit(url, memberId, partId, label) {
        const params = new URLSearchParams();
        params.append('memberId', memberId);
        params.append('partId', partId);

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params
            });
            const data = await res.json();
            if (data.success) {
                showToast('✓ 파트를 ' + label + '했습니다.');
                setTimeout(() => location.reload(), 600);
            } else {
                showToast('✕ ' + (data.error || '요청에 실패했습니다.'), true);
            }
        } catch (e) {
            showToast('✕ 오류가 발생했습니다.', true);
        }
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-message').textContent = message;
        toast.className = `toast custom-toast align-items-center border-0 ${isError ? 'text-bg-danger' : 'text-bg-dark'}`;
        new bootstrap.Toast(toast, { delay: 3000 }).show();
    }
</script>
</body>
</html>
