<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SCOUTER ADMIN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .req-card {
            background: #fff;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: grab;
            user-select: none;
            transition: box-shadow 0.15s, opacity 0.15s;
        }
        .req-card:active { cursor: grabbing; }
        .req-card.dragging { opacity: 0.4; }
        .req-card .card-text { flex: 1; font-size: 0.9rem; }
        .req-area {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        .req-list-wrap { flex: 1; }
        .req-list {
            min-height: 160px;
            border: 2px dashed #dee2e6;
            border-radius: 8px;
            padding: 12px;
            transition: background-color 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }
        #empty-msg {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ced4da;
            font-size: 0.85rem;
        }
        .trash-zone {
            width: 200px;
            min-height: 160px;
            border: 2px dashed #f5c6cb;
            border-radius: 8px;
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #dc3545;
            font-size: 0.8rem;
            text-align: center;
            transition: background-color 0.2s, border-color 0.2s;
            flex-shrink: 0;
            margin-right: -48px;
        }
        .trash-zone.drag-over {
            background-color: #fff0f0;
            border-color: #dc3545;
        }
        #new-item-input::placeholder { color: #ced4da; }
        .save-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="/images/logo.svg">
</head>
<body class="d-flex">
<div th:replace="~{admin/fragments/nav :: sidebar}" th:with="currentMenu='job-fit'"></div>

<div class="flex-grow-1 p-5" style="max-width: 720px;">
    <div class="mb-4">
        <h2 class="mb-1">Job fit 요구조건 관리</h2>
        <p class="text-muted mb-0">파트별 Job fit 면접 요구조건을 관리합니다.
            <span class="ms-2 badge bg-secondary" th:text="${semester}"></span>
        </p>
    </div>

    <div class="mb-4">
        <label class="form-label mb-1 small">파트</label>
        <select id="part-select" class="form-select" style="max-width: 240px;"
                onchange="location.href='/admin/recruiting/requirements/job-fit?semester='+encodeURIComponent(document.getElementById('semester-val').value)+'&partId='+this.value">
            <option value="" disabled th:selected="${partId == null}">파트 선택</option>
            <option th:each="part : ${parts}"
                    th:value="${part.id}"
                    th:text="${part.name}"
                    th:selected="${part.id == partId}">
            </option>
        </select>
        <input type="hidden" id="semester-val" th:value="${semester}">
    </div>

    <div th:if="${partId != null}">
        <form method="post" action="/admin/recruiting/requirements/job-fit" id="req-form">
            <input type="hidden" name="partId" th:value="${partId}">
            <input type="hidden" name="semester" th:value="${semester}">
            <div id="hidden-items"></div>

            <div class="req-area">
                <div class="req-list-wrap">
                    <div class="req-list" id="req-list">
                        <div th:each="item : ${requirements?.job}"
                             class="req-card"
                             draggable="true"
                             th:attr="data-id=${item.id}, data-content=${item.content}">
                            <span class="card-text" th:text="${item.content}"></span>
                        </div>
                        <div th:if="${requirements == null or requirements.job.isEmpty()}"
                             id="empty-msg">
                            등록된 요구조건이 없습니다.
                        </div>
                    </div>
                <div class="d-flex gap-2 mt-3">
                    <input type="text" id="new-item-input" class="form-control form-control-sm" placeholder="새 요구조건을 입력하세요">
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="btn-add" style="flex-shrink:0">추가</button>
                </div>
            </div>
                <div class="trash-zone" id="trash-zone">
                    🗑<br>여기로 드래그하면 삭제됩니다
                </div>
            </div>
        </form>
    </div>
</div>

<div class="save-toast">
    <div id="toast" class="toast align-items-center border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="toast-message"></div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const SEMESTER = /*[[${semester}]]*/ '';
    const PART_ID = /*[[${partId}]]*/ null;
    let draggedCard = null;

    function updateEmptyMsg() {
        const list = document.getElementById('req-list');
        if (!list) return;
        let msg = list.querySelector('#empty-msg');
        const hasCards = list.querySelectorAll('.req-card').length > 0;
        if (hasCards && msg) msg.remove();
        if (!hasCards && !msg) {
            msg = document.createElement('div');
            msg.id = 'empty-msg';
            msg.textContent = '등록된 요구조건이 없습니다.';
            list.appendChild(msg);
        }
    }

    function makeCard(id, content) {
        const div = document.createElement('div');
        div.className = 'req-card';
        div.draggable = true;
        div.dataset.id = id || '';
        div.dataset.content = content;
        div.innerHTML = `<span class="card-text">${content}</span>`;
        attachDrag(div);
        return div;
    }

    function attachDrag(card) {
        card.addEventListener('dragstart', e => {
            draggedCard = card;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', () => {
            card.classList.remove('dragging');
            draggedCard = null;
        });
    }

    document.querySelectorAll('.req-card').forEach(attachDrag);

    const trash = document.getElementById('trash-zone');
    if (trash) {
        trash.addEventListener('dragover', e => { e.preventDefault(); trash.classList.add('drag-over'); });
        trash.addEventListener('dragleave', () => trash.classList.remove('drag-over'));
        trash.addEventListener('drop', e => {
            e.preventDefault();
            trash.classList.remove('drag-over');
            if (draggedCard) {
                draggedCard.remove();
                updateEmptyMsg();
                save('delete');
            }
        });
    }

    function addItem() {
        const input = document.getElementById('new-item-input');
        const content = input.value.trim();
        if (!content) return;
        const list = document.getElementById('req-list');
        list.querySelector('#empty-msg')?.remove();
        list.appendChild(makeCard('', content));
        input.value = '';
        updateEmptyMsg();
        save('add');
    }

    document.getElementById('btn-add')?.addEventListener('click', addItem);
    document.getElementById('new-item-input')?.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); addItem(); }
    });

    async function save(action) {
        const params = new URLSearchParams();
        params.append('semester', SEMESTER);
        params.append('partId', PART_ID);
        document.querySelectorAll('#req-list .req-card').forEach((card, i) => {
            params.append(`items[${i}].id`, card.dataset.id || '');
            params.append(`items[${i}].content`, card.dataset.content);
        });
        try {
            const res = await fetch('/admin/recruiting/requirements/job-fit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: params,
            });
            const data = await res.json();
            if (data.success) showToast(action === 'delete' ? '✓ 삭제되었습니다.' : '✓ 저장되었습니다.');
            else showToast('✕ ' + (data.error ?? '오류가 발생했습니다.'), true);
        } catch {
            showToast('✕ 오류가 발생했습니다.', true);
        }
    }

    function showToast(message, isError = false) {
        const toast = document.getElementById('toast');
        document.getElementById('toast-message').textContent = message;
        toast.className = `toast align-items-center border-0 ${isError ? 'text-bg-danger' : 'text-bg-success'}`;
        new bootstrap.Toast(toast, { delay: 2500 }).show();
    }
</script>
</body>
</html>
