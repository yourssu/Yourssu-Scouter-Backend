<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Culture fit 요구조건 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="d-flex">
<div th:replace="~{admin/fragments/nav :: sidebar}" th:with="currentMenu='culture-fit'"></div>

<div class="flex-grow-1 p-5" style="max-width: 720px;">
    <div class="mb-4">
        <h2 class="mb-1">Culture fit 요구조건 관리</h2>
        <p class="text-muted mb-0">모든 파트에 공통 적용되는 Culture fit 면접 요구조건을 관리합니다.</p>
    </div>

    <form method="get" action="/admin/recruiting/requirements/culture-fit" class="row g-2 align-items-end mb-4">
        <div class="col-auto">
            <label class="form-label mb-1 small">학기</label>
            <input type="text" name="semester" class="form-control form-control-sm"
                   placeholder="예: 2025-1" th:value="${semester}" required>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary btn-sm">조회</button>
        </div>
    </form>

    <div th:if="${requirements != null}">
        <div th:if="${error}" class="alert alert-danger mb-3" th:text="${error}"></div>
        <div th:if="${success}" class="alert alert-success mb-3">저장되었습니다.</div>

        <form method="post" action="/admin/recruiting/requirements/culture-fit" id="req-form">
            <input type="hidden" name="semester" th:value="${semester}">

            <div class="mb-3">
                <div id="req-list">
                    <div th:each="item, stat : ${requirements.culture}" class="input-group mb-2 req-row">
                        <input type="hidden" th:name="|items[${stat.index}].id|" th:value="${item.id}">
                        <input type="text" class="form-control"
                               th:name="|items[${stat.index}].content|"
                               th:value="${item.content}"
                               placeholder="요구조건을 입력하세요" required>
                        <button type="button" class="btn btn-outline-danger btn-remove">삭제</button>
                    </div>
                </div>
                <button type="button" class="btn btn-outline-secondary btn-sm mt-2" id="btn-add">+ 항목 추가</button>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">저장</button>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function reindex() {
        document.querySelectorAll('#req-list .req-row').forEach((row, i) => {
            row.querySelector('input[type="hidden"]').name = `items[${i}].id`;
            row.querySelector('input[type="text"]').name = `items[${i}].content`;
        });
    }

    document.getElementById('btn-add')?.addEventListener('click', () => {
        const list = document.getElementById('req-list');
        const idx = list.querySelectorAll('.req-row').length;
        const row = document.createElement('div');
        row.className = 'input-group mb-2 req-row';
        row.innerHTML = `
            <input type="hidden" name="items[${idx}].id" value="">
            <input type="text" class="form-control" name="items[${idx}].content" placeholder="요구조건을 입력하세요" required>
            <button type="button" class="btn btn-outline-danger btn-remove">삭제</button>
        `;
        list.appendChild(row);
        attachRemove(row.querySelector('.btn-remove'));
    });

    function attachRemove(btn) {
        btn.addEventListener('click', () => {
            btn.closest('.req-row').remove();
            reindex();
        });
    }

    document.querySelectorAll('.btn-remove').forEach(attachRemove);
</script>
</body>
</html>
